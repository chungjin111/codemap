<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코드맵</title>
<style>
:root {
  --bg: #f3f1ea; --dot: #d6d2c5; --surface: #fffefa; --surface-2: #f7f5ee;
  --ink: #1d1c19; --muted: #6d6960; --line: #dbd7ca;
  --shadow: 0 1px 2px rgba(40,32,16,.07), 0 8px 22px rgba(40,32,16,.07);
  --code-bg: #fbfaf5; --code-ink: #2b2a26;
  --t-com: #8d8779; --t-str: #2c7a4b; --t-kw: #a03c8e; --t-num: #b15f14;
  --t-fn: #2a5fc0; --t-type: #0c7b84; --t-dec: #b15f14;
  --L: .55; --C: .135; --tintL: .955; --tintC: .03;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "D2Coding", monospace;
  --sans: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131312; --dot: #2a2926; --surface: #1e1d1b; --surface-2: #252421;
    --ink: #ece9e1; --muted: #a09b90; --line: #36342f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.28);
    --code-bg: #191817; --code-ink: #dedbd2;
    --t-com: #7d786c; --t-str: #86c79b; --t-kw: #d993c9; --t-num: #e0a467;
    --t-fn: #8fb4f2; --t-type: #6fc8cf; --t-dec: #e0a467;
    --L: .76; --C: .115; --tintL: .265; --tintC: .035;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131312; --dot: #2a2926; --surface: #1e1d1b; --surface-2: #252421;
  --ink: #ece9e1; --muted: #a09b90; --line: #36342f;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.28);
  --code-bg: #191817; --code-ink: #dedbd2;
  --t-com: #7d786c; --t-str: #86c79b; --t-kw: #d993c9; --t-num: #e0a467;
  --t-fn: #8fb4f2; --t-type: #6fc8cf; --t-dec: #e0a467;
  --L: .76; --C: .115; --tintL: .265; --tintC: .035;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: grid; grid-template-rows: auto 1fr; background: var(--bg); color: var(--ink);
  font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden;
}
button { font: inherit; color: inherit; }

/* ── 상단 바 ── */
.bar {
  display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); z-index: 5;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 220px; }
.brand svg { flex: none; color: var(--ink); }
.brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand span { display: block; font-size: 11.5px; color: var(--muted); }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn {
  height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); cursor: pointer; font-size: 12.5px; font-weight: 500; white-space: nowrap;
  transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn:focus-visible, .lk:focus-visible, .copy:focus-visible, .pt:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn.icon { width: 32px; padding: 0; display: grid; place-items: center; }
.btn.scope { color: var(--muted); }
.btn.scope b { color: var(--ink); font-weight: 600; }
.seg { display: flex; }
.seg .btn:first-child { border-radius: 8px 0 0 8px; }
.seg .btn:last-child { border-radius: 0 8px 8px 0; margin-left: -1px; }

/* ── 캔버스 ── */
#vp {
  position: relative; overflow: hidden; touch-action: none; cursor: grab;
  background-image: radial-gradient(var(--dot) 1.1px, transparent 1.2px); background-size: 24px 24px;
}
#vp.grabbing { cursor: grabbing; }
#canvas { position: absolute; left: 0; top: 0; width: max-content; transform-origin: 0 0; will-change: transform; }
#canvas.glide { transition: transform .3s cubic-bezier(.2,.7,.2,1); }
#edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke: oklch(var(--L) var(--C) var(--h)); stroke-width: 1.75; opacity: .75; }
.edge.code { stroke-width: 1.4; }
.edge.explain { stroke-width: 1.4; stroke-dasharray: 3 4; }
.flow { fill: none; stroke: var(--muted); stroke-width: 1.5; opacity: .7; }
#arr path { fill: var(--muted); }

.branch {
  display: flex; align-items: center; gap: 58px; flex: none;
  --accent: oklch(var(--L) var(--C) var(--h, 255));
  --tint: oklch(var(--tintL) var(--tintC) var(--h, 255));
}
.kids { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; flex: none; }
.kids.ordered { gap: 28px; }
.kids[hidden] { display: none; }
.kids.enter > .branch { animation: pop .24s ease both; }
@keyframes pop { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }

/* ── 박스 공통 ── */
.node {
  position: relative; flex: none; width: max-content; min-width: 150px; max-width: 290px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 14px 10px 12px; box-shadow: var(--shadow);
  cursor: pointer; user-select: none; -webkit-user-select: none;
  transition: border-color .15s, background .15s, box-shadow .15s;
}
.node:hover { border-color: var(--accent); }
.node:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.node.leaf, .node.explain { cursor: inherit; }
.node.flash { animation: flash 1.4s ease; }
@keyframes flash { 0%, 60% { box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 45%, transparent), var(--shadow); } 100% { box-shadow: var(--shadow); } }
.eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .65; margin-bottom: 2px; }
.title { font-weight: 650; font-size: 14px; letter-spacing: -.01em; line-height: 1.35; }
.sum { margin: 4px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--muted); }

/* 펼침 손잡이: 닫혀 있으면 하위 개수, 열려 있으면 − */
.tog {
  position: absolute; right: -11px; top: 50%; translate: 0 -50%;
  min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px;
  display: grid; place-items: center; font: 600 11px/1 var(--sans);
  background: var(--surface); color: var(--accent); border: 1.5px solid var(--accent);
}
.node.open > .tog { background: var(--accent); color: var(--surface); }

/* 루트 */
.node.root { background: var(--ink); color: var(--bg); border-color: var(--ink); max-width: 300px; padding: 14px 18px 14px 16px; border-radius: 16px; }
.node.root .title { font-size: 17px; font-weight: 750; }
.node.root .sum { color: inherit; opacity: .78; }
.node.root > .tog { background: var(--bg); color: var(--ink); border-color: var(--ink); }
.node.root.open > .tog { background: var(--ink); color: var(--bg); border-color: var(--bg); }

/* 기능 박스 */
.node.feat { border-left: 4px solid var(--accent); }
.node.feat.open { background: var(--tint); border-color: var(--accent); }
.row { display: flex; align-items: baseline; gap: 8px; }
.step {
  flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; align-self: center;
  background: var(--accent); color: var(--surface); font: 700 11px/1 var(--sans);
}
.meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.chip { font: 11px/1.5 var(--mono); padding: 1px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node.feat.open .chip { background: color-mix(in oklch, var(--surface) 60%, transparent); }
.links { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; margin-top: 8px; }
.lk {
  border: 0; background: none; padding: 1px 0; cursor: pointer; text-align: left;
  font-size: 11.5px; color: var(--accent); font-weight: 600; max-width: 100%; white-space: normal;
}
.lk:hover { text-decoration: underline; }
.lk span { color: var(--muted); font-weight: 400; }

/* 코드 박스 */
.node.code { max-width: 780px; min-width: 300px; padding: 0; overflow: visible; background: var(--code-bg); }
.node.code.open { border-color: var(--accent); }
.code-head { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); border-radius: 12px 12px 0 0; }
.code-title { font-weight: 650; font-size: 13px; }
.code-loc { margin-left: auto; border: 0; background: none; padding: 2px 0; cursor: pointer; font: 11px/1.4 var(--mono); color: var(--muted); text-align: right; overflow-wrap: anywhere; }
.code-loc:hover { color: var(--accent); text-decoration: underline; }
.code-loc:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.copy { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 1px 8px; font-size: 11px; color: var(--muted); cursor: pointer; }
.copy:hover { color: var(--ink); border-color: var(--muted); }
.src { margin: 0; padding: 8px 0; font: 12px/1.6 var(--mono); color: var(--code-ink); tab-size: 4; }
.l { display: grid; grid-template-columns: 46px minmax(0, 1fr); min-height: 1.6em; }
.ln { text-align: right; padding-right: 12px; color: var(--muted); opacity: .55; cursor: pointer; }
.ln:hover { opacity: 1; color: var(--accent); text-decoration: underline; }
.lc { white-space: pre-wrap; overflow-wrap: anywhere; padding-right: 18px; }
.l.hl, .l.pin { background: color-mix(in oklch, var(--accent) 17%, transparent); }
.l.hl .ln, .l.pin .ln { opacity: 1; color: var(--accent); font-weight: 700; }
.l.sel { background: color-mix(in oklch, var(--accent) 28%, transparent); }
.l.sel .ln { opacity: 1; color: var(--accent); font-weight: 700; }
.locbar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-top: 1px solid var(--line); background: var(--surface); font: 11.5px/1.5 var(--mono); }
.locbar-k { font: 700 10.5px/1 var(--sans); letter-spacing: .06em; color: var(--accent); }
.locbar-v { flex: 1; min-width: 0; overflow-wrap: anywhere; color: var(--ink); }
.chip.path { cursor: pointer; }
.chip.path:hover { border-color: var(--accent); color: var(--accent); }
.t-com { color: var(--t-com); font-style: italic; } .t-str { color: var(--t-str); } .t-kw { color: var(--t-kw); }
.t-num { color: var(--t-num); } .t-fn { color: var(--t-fn); } .t-type { color: var(--t-type); } .t-dec { color: var(--t-dec); }
.code-foot { padding: 6px 12px; font-size: 11.5px; color: var(--accent); font-weight: 600; border-top: 1px dashed var(--line); border-radius: 0 0 12px 12px; }
.node.code .when-open, .node.code.open .when-closed { display: none; }
.node.code.open .when-open { display: inline; }

/* 설명 박스 */
.node.explain { max-width: 360px; background: var(--tint); border-color: color-mix(in oklch, var(--accent) 40%, var(--line)); padding: 12px 14px; }
.node.explain .eyebrow { color: var(--accent); opacity: 1; }
.prose p { margin: 0 0 8px; font-size: 13px; line-height: 1.65; }
.prose p:last-child { margin-bottom: 0; }
.prose code, .pt code { font: 12px var(--mono); padding: 1px 5px; border-radius: 4px; background: color-mix(in oklch, var(--surface) 70%, transparent); border: 1px solid color-mix(in oklch, var(--accent) 25%, transparent); }
.pts { list-style: none; margin: 10px 0 0; padding: 8px 0 0; border-top: 1px dashed color-mix(in oklch, var(--accent) 40%, transparent); display: grid; gap: 2px; }
.pt { display: grid; grid-template-columns: auto 1fr; gap: 8px; padding: 4px 6px; margin: 0 -6px; border-radius: 6px; font-size: 12.5px; line-height: 1.55; cursor: pointer; }
.pt:hover, .pt.pin { background: color-mix(in oklch, var(--accent) 16%, transparent); }
.pt-ln { font: 600 11px/1.9 var(--mono); color: var(--accent); white-space: nowrap; }

/* ── 떠 있는 UI ── */
.float { position: absolute; z-index: 4; cursor: default; }
.hint { left: 14px; bottom: 14px; font-size: 11.5px; color: var(--muted); background: color-mix(in oklch, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
.hint b { color: var(--ink); font-weight: 600; }
#toast { left: 50%; bottom: 58px; translate: -50% 8px; opacity: 0; pointer-events: none; max-width: calc(100% - 28px); overflow-wrap: anywhere; background: var(--ink); color: var(--bg); font: 12px/1.5 var(--mono); padding: 7px 12px; border-radius: 8px; box-shadow: var(--shadow); transition: opacity .15s, translate .15s; }
#toast.show { opacity: 1; translate: -50% 0; }
.zoom { right: 14px; bottom: 14px; display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
.zoom button { width: 32px; height: 32px; border: 0; background: none; cursor: pointer; font-size: 16px; border-radius: 8px; }
.zoom button:hover { background: var(--surface-2); }
.zoom span { min-width: 46px; text-align: center; font: 12px var(--mono); color: var(--muted); }
#scope {
  top: 12px; right: 12px; bottom: 12px; width: min(380px, calc(100% - 24px)); overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px;
}
#scope[hidden] { display: none; }
#scope h2 { margin: 0 0 4px; font-size: 15px; }
#scope h3 { margin: 18px 0 6px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
#scope p { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); }
#scope .x { position: absolute; top: 10px; right: 10px; }
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stat div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.stat b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.stat span { font-size: 11.5px; color: var(--muted); }
.drop { padding: 8px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.drop div { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
.drop div span { color: var(--muted); font-weight: 400; white-space: nowrap; }
.drop small { display: block; margin-top: 2px; font: 11px/1.5 var(--mono); color: var(--muted); overflow-wrap: anywhere; }

@media (max-width: 640px) {
  .bar { padding: 8px 12px; }
  .hint { display: none; }
  .btn { padding: 0 9px; }
}
@media (prefers-reduced-motion: reduce) {
  .kids.enter > .branch, .node.flash { animation: none; }
  #canvas.glide { transition: none; }
}
</style>
</head>

  if (n && n._it) toggle(n._it);
}
tree.addEventListener('click', function (e) { if (!moved) activate(e.target); });
tree.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  if (e.target.closest('button')) return;
  if (e.target.classList.contains('node') || e.target.classList.contains('pt')) { e.preventDefault(); activate(e.target); }
});
tree.addEventListener('mouseover', function (e) { var pt = e.target.closest('.pt'); if (pt) markLines(pt, 'hl', true); });
tree.addEventListener('mouseout', function (e) { var pt = e.target.closest('.pt'); if (pt && !pt.contains(e.relatedTarget)) markLines(pt, 'hl', false); });

function center() { var r = vp.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
var ACT = {
  more: more, less: less, reset: reset,
  fit: function () { fit(true); },
  zin: function () { var c = center(); glide(); zoomAt(c[0], c[1], 1.2); },
  zout: function () { var c = center(); glide(); zoomAt(c[0], c[1], 1 / 1.2); },
  theme: function () {
    var el = document.documentElement, cur = el.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = cur === 'dark' ? 'light' : 'dark';
    el.setAttribute('data-theme', next);
    try { localStorage.setItem('codemap-theme', next); } catch (e) {}
  },
  scope: function () { scopeEl.hidden = !scopeEl.hidden; }
};
document.addEventListener('click', function (e) { var b = e.target.closest('[data-act]'); if (b && ACT[b.dataset.act]) ACT[b.dataset.act](); });
document.addEventListener('keydown', function (e) {
  if (e.target.closest('input,textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '+' || e.key === '=') ACT.zin(); else if (e.key === '-') ACT.zout(); else if (e.key === '0') ACT.fit();
  else if (e.key === 'Escape') scopeEl.hidden = true;
});

/* ── 머리말·분석 범위 ── */
try { var saved = localStorage.getItem('codemap-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); } catch (e) {}
$('#t-title').textContent = DATA.title || '코드맵';
$('#t-sub').textContent = '코드맵' + (DATA.generated ? ' · ' + DATA.generated : '');
if (DATA === DEMO) document.title = '코드맵 템플릿';
var S = DATA.scope, sb = $('#b-scope');
if (S) {
  sb.dataset.act = 'scope';
  sb.innerHTML = '파일 <b>' + S.analyzed + '</b>개 분석 · <b>' + (S.dropped_files + S.dropped_dirs) + '</b>건 제외';
  var h = '<button type="button" class="btn icon x" data-act="scope" aria-label="닫기">✕</button><h2>분석 범위</h2>' +
    '<p>토큰을 아끼기 위해, 이름만 보고 필요 없다고 판단한 파일은 열어 보지 않았습니다. 이 지도에 없는 내용은 아래에서 제외된 것일 수 있습니다.</p>' +
    '<div class="stat"><div><b>' + S.analyzed + '</b><span>살펴본 코드 파일</span></div><div><b>' + S.in_map + '</b><span>지도에 실린 파일</span></div><div><b>' + S.dropped_files + '</b><span>제외한 파일</span></div></div>';
  if (S.dropped && S.dropped.length) {
    h += '<h3>제외한 것</h3>';
    S.dropped.forEach(function (d) {
      var n = [d.files ? '파일 ' + d.files : '', d.dirs ? '폴더 ' + d.dirs : ''].filter(Boolean).join(' · ');
      h += '<div class="drop"><div>' + esc(d.reason) + '<span>' + n + '</span></div><small>' + (d.examples || []).map(esc).join(', ') + '</small></div>';
    });
  }
  if (S.groups && S.groups.length) {
    h += '<h3>반복 묶음</h3>';
    S.groups.forEach(function (g) {
      h += '<div class="drop"><div>' + esc(g.pattern) + '<span>×' + g.count + '</span></div><small>' + (g.collapsed ? '대표만 분석: ' + (g.reps || []).map(function (r) { return esc(r.split('/').pop()); }).join(', ') : '전부 분석 (같은 패턴)') + '</small></div>';
    });
  }
  scopeEl.innerHTML = h;
} else sb.hidden = true;

/* ── 시작 ── */
tree.appendChild(renderBranch(root));
setOpen(root, true);
home(); draw();
if (window.ResizeObserver) new ResizeObserver(queueDraw).observe(tree);
window.addEventListener('resize', queueDraw);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(queueDraw);
})();
</script>
</body>
</html>
