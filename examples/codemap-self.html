<title>코드맵 (codemap) · 코드맵</title>
<style>
:root {
  --bg: #f3f1ea; --dot: #d6d2c5; --surface: #fffefa; --surface-2: #f7f5ee;
  --ink: #1d1c19; --muted: #6d6960; --line: #dbd7ca;
  --shadow: 0 1px 2px rgba(40,32,16,.07), 0 8px 22px rgba(40,32,16,.07);
  --code-bg: #fbfaf5; --code-ink: #2b2a26;
  --t-com: #8d8779; --t-str: #2c7a4b; --t-kw: #a03c8e; --t-num: #b15f14;
  --t-fn: #2a5fc0; --t-type: #0c7b84; --t-dec: #b15f14;
  --L: .55; --C: .135; --tintL: .955; --tintC: .03;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "D2Coding", monospace;
  --sans: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131312; --dot: #2a2926; --surface: #1e1d1b; --surface-2: #252421;
    --ink: #ece9e1; --muted: #a09b90; --line: #36342f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.28);
    --code-bg: #191817; --code-ink: #dedbd2;
    --t-com: #7d786c; --t-str: #86c79b; --t-kw: #d993c9; --t-num: #e0a467;
    --t-fn: #8fb4f2; --t-type: #6fc8cf; --t-dec: #e0a467;
    --L: .76; --C: .115; --tintL: .265; --tintC: .035;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131312; --dot: #2a2926; --surface: #1e1d1b; --surface-2: #252421;
  --ink: #ece9e1; --muted: #a09b90; --line: #36342f;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.28);
  --code-bg: #191817; --code-ink: #dedbd2;
  --t-com: #7d786c; --t-str: #86c79b; --t-kw: #d993c9; --t-num: #e0a467;
  --t-fn: #8fb4f2; --t-type: #6fc8cf; --t-dec: #e0a467;
  --L: .76; --C: .115; --tintL: .265; --tintC: .035;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: grid; grid-template-rows: auto 1fr; background: var(--bg); color: var(--ink);
  font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden;
}
button { font: inherit; color: inherit; }

/* ── 상단 바 ── */
.bar {
  display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); z-index: 5;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 220px; }
.brand svg { flex: none; color: var(--ink); }
.brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand span { display: block; font-size: 11.5px; color: var(--muted); }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn {
  height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); cursor: pointer; font-size: 12.5px; font-weight: 500; white-space: nowrap;
  transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn:focus-visible, .lk:focus-visible, .copy:focus-visible, .pt:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn.icon { width: 32px; padding: 0; display: grid; place-items: center; }
.btn.scope { color: var(--muted); }
.btn.scope b { color: var(--ink); font-weight: 600; }
.seg { display: flex; }
.seg .btn:first-child { border-radius: 8px 0 0 8px; }
.seg .btn:last-child { border-radius: 0 8px 8px 0; margin-left: -1px; }

/* ── 캔버스 ── */
#vp {
  position: relative; overflow: hidden; touch-action: none; cursor: grab;
  background-image: radial-gradient(var(--dot) 1.1px, transparent 1.2px); background-size: 24px 24px;
}
#vp.grabbing { cursor: grabbing; }
#canvas { position: absolute; left: 0; top: 0; width: max-content; transform-origin: 0 0; will-change: transform; }
#canvas.glide { transition: transform .3s cubic-bezier(.2,.7,.2,1); }
#edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke: oklch(var(--L) var(--C) var(--h)); stroke-width: 1.75; opacity: .75; }
.edge.code { stroke-width: 1.4; }
.edge.explain { stroke-width: 1.4; stroke-dasharray: 3 4; }
.flow { fill: none; stroke: var(--muted); stroke-width: 1.5; opacity: .7; }
#arr path { fill: var(--muted); }

.branch {
  display: flex; align-items: center; gap: 58px; flex: none;
  --accent: oklch(var(--L) var(--C) var(--h, 255));
  --tint: oklch(var(--tintL) var(--tintC) var(--h, 255));
}
.kids { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; flex: none; }
.kids.ordered { gap: 28px; }
.kids[hidden] { display: none; }
.kids.enter > .branch { animation: pop .24s ease both; }
@keyframes pop { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }

/* ── 박스 공통 ── */
.node {
  position: relative; flex: none; width: max-content; min-width: 150px; max-width: 290px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 14px 10px 12px; box-shadow: var(--shadow);
  cursor: pointer; user-select: none; -webkit-user-select: none;
  transition: border-color .15s, background .15s, box-shadow .15s;
}
.node:hover { border-color: var(--accent); }
.node:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.node.leaf, .node.explain { cursor: inherit; }
.node.flash { animation: flash 1.4s ease; }
@keyframes flash { 0%, 60% { box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 45%, transparent), var(--shadow); } 100% { box-shadow: var(--shadow); } }
.eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .65; margin-bottom: 2px; }
.title { font-weight: 650; font-size: 14px; letter-spacing: -.01em; line-height: 1.35; }
.sum { margin: 4px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--muted); }

/* 펼침 손잡이: 닫혀 있으면 하위 개수, 열려 있으면 − */
.tog {
  position: absolute; right: -11px; top: 50%; translate: 0 -50%;
  min-width: 22px; height: 22px; padding: 0 5px; border-radius: 11px;
  display: grid; place-items: center; font: 600 11px/1 var(--sans);
  background: var(--surface); color: var(--accent); border: 1.5px solid var(--accent);
}
.node.open > .tog { background: var(--accent); color: var(--surface); }

/* 루트 */
.node.root { background: var(--ink); color: var(--bg); border-color: var(--ink); max-width: 300px; padding: 14px 18px 14px 16px; border-radius: 16px; }
.node.root .title { font-size: 17px; font-weight: 750; }
.node.root .sum { color: inherit; opacity: .78; }
.node.root > .tog { background: var(--bg); color: var(--ink); border-color: var(--ink); }
.node.root.open > .tog { background: var(--ink); color: var(--bg); border-color: var(--bg); }

/* 기능 박스 */
.node.feat { border-left: 4px solid var(--accent); }
.node.feat.open { background: var(--tint); border-color: var(--accent); }
.row { display: flex; align-items: baseline; gap: 8px; }
.step {
  flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; align-self: center;
  background: var(--accent); color: var(--surface); font: 700 11px/1 var(--sans);
}
.meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.chip { font: 11px/1.5 var(--mono); padding: 1px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node.feat.open .chip { background: color-mix(in oklch, var(--surface) 60%, transparent); }
.links { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; margin-top: 8px; }
.lk {
  border: 0; background: none; padding: 1px 0; cursor: pointer; text-align: left;
  font-size: 11.5px; color: var(--accent); font-weight: 600; max-width: 100%; white-space: normal;
}
.lk:hover { text-decoration: underline; }
.lk span { color: var(--muted); font-weight: 400; }

/* 코드 박스 */
.node.code { max-width: 780px; min-width: 300px; padding: 0; overflow: visible; background: var(--code-bg); }
.node.code.open { border-color: var(--accent); }
.code-head { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface); border-radius: 12px 12px 0 0; }
.code-title { font-weight: 650; font-size: 13px; }
.code-loc { margin-left: auto; border: 0; background: none; padding: 2px 0; cursor: pointer; font: 11px/1.4 var(--mono); color: var(--muted); text-align: right; overflow-wrap: anywhere; }
.code-loc:hover { color: var(--accent); text-decoration: underline; }
.code-loc:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.copy { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 1px 8px; font-size: 11px; color: var(--muted); cursor: pointer; }
.copy:hover { color: var(--ink); border-color: var(--muted); }
.src { margin: 0; padding: 8px 0; font: 12px/1.6 var(--mono); color: var(--code-ink); tab-size: 4; }
.l { display: grid; grid-template-columns: 46px minmax(0, 1fr); min-height: 1.6em; }
.ln { text-align: right; padding-right: 12px; color: var(--muted); opacity: .55; cursor: pointer; }
.ln:hover { opacity: 1; color: var(--accent); text-decoration: underline; }
.lc { white-space: pre-wrap; overflow-wrap: anywhere; padding-right: 18px; }
.l.hl, .l.pin { background: color-mix(in oklch, var(--accent) 17%, transparent); }
.l.hl .ln, .l.pin .ln { opacity: 1; color: var(--accent); font-weight: 700; }
.l.sel { background: color-mix(in oklch, var(--accent) 28%, transparent); }
.l.sel .ln { opacity: 1; color: var(--accent); font-weight: 700; }
.locbar { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-top: 1px solid var(--line); background: var(--surface); font: 11.5px/1.5 var(--mono); }
.locbar-k { font: 700 10.5px/1 var(--sans); letter-spacing: .06em; color: var(--accent); }
.locbar-v { flex: 1; min-width: 0; overflow-wrap: anywhere; color: var(--ink); }
.chip.path { cursor: pointer; }
.chip.path:hover { border-color: var(--accent); color: var(--accent); }
.t-com { color: var(--t-com); font-style: italic; } .t-str { color: var(--t-str); } .t-kw { color: var(--t-kw); }
.t-num { color: var(--t-num); } .t-fn { color: var(--t-fn); } .t-type { color: var(--t-type); } .t-dec { color: var(--t-dec); }
.code-foot { padding: 6px 12px; font-size: 11.5px; color: var(--accent); font-weight: 600; border-top: 1px dashed var(--line); border-radius: 0 0 12px 12px; }
.node.code .when-open, .node.code.open .when-closed { display: none; }
.node.code.open .when-open { display: inline; }

/* 설명 박스 */
.node.explain { max-width: 360px; background: var(--tint); border-color: color-mix(in oklch, var(--accent) 40%, var(--line)); padding: 12px 14px; }
.node.explain .eyebrow { color: var(--accent); opacity: 1; }
.prose p { margin: 0 0 8px; font-size: 13px; line-height: 1.65; }
.prose p:last-child { margin-bottom: 0; }
.prose code, .pt code { font: 12px var(--mono); padding: 1px 5px; border-radius: 4px; background: color-mix(in oklch, var(--surface) 70%, transparent); border: 1px solid color-mix(in oklch, var(--accent) 25%, transparent); }
.pts { list-style: none; margin: 10px 0 0; padding: 8px 0 0; border-top: 1px dashed color-mix(in oklch, var(--accent) 40%, transparent); display: grid; gap: 2px; }
.pt { display: grid; grid-template-columns: auto 1fr; gap: 8px; padding: 4px 6px; margin: 0 -6px; border-radius: 6px; font-size: 12.5px; line-height: 1.55; cursor: pointer; }
.pt:hover, .pt.pin { background: color-mix(in oklch, var(--accent) 16%, transparent); }
.pt-ln { font: 600 11px/1.9 var(--mono); color: var(--accent); white-space: nowrap; }

/* ── 떠 있는 UI ── */
.float { position: absolute; z-index: 4; cursor: default; }
.hint { left: 14px; bottom: 14px; font-size: 11.5px; color: var(--muted); background: color-mix(in oklch, var(--surface) 88%, transparent); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; }
.hint b { color: var(--ink); font-weight: 600; }
#toast { left: 50%; bottom: 58px; translate: -50% 8px; opacity: 0; pointer-events: none; max-width: calc(100% - 28px); overflow-wrap: anywhere; background: var(--ink); color: var(--bg); font: 12px/1.5 var(--mono); padding: 7px 12px; border-radius: 8px; box-shadow: var(--shadow); transition: opacity .15s, translate .15s; }
#toast.show { opacity: 1; translate: -50% 0; }
.zoom { right: 14px; bottom: 14px; display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
.zoom button { width: 32px; height: 32px; border: 0; background: none; cursor: pointer; font-size: 16px; border-radius: 8px; }
.zoom button:hover { background: var(--surface-2); }
.zoom span { min-width: 46px; text-align: center; font: 12px var(--mono); color: var(--muted); }
#scope {
  top: 12px; right: 12px; bottom: 12px; width: min(380px, calc(100% - 24px)); overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px;
}
#scope[hidden] { display: none; }
#scope h2 { margin: 0 0 4px; font-size: 15px; }
#scope h3 { margin: 18px 0 6px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
#scope p { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); }
#scope .x { position: absolute; top: 10px; right: 10px; }
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stat div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.stat b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.stat span { font-size: 11.5px; color: var(--muted); }
.drop { padding: 8px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.drop div { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; }
.drop div span { color: var(--muted); font-weight: 400; white-space: nowrap; }
.drop small { display: block; margin-top: 2px; font: 11px/1.5 var(--mono); color: var(--muted); overflow-wrap: anywhere; }

@media (max-width: 640px) {
  .bar { padding: 8px 12px; }
  .hint { display: none; }
  .btn { padding: 0 9px; }
}
@media (prefers-reduced-motion: reduce) {
  .kids.enter > .branch, .node.flash { animation: none; }
  #canvas.glide { transition: none; }
}
</style>

<script id="codemap-data" type="application/json">{"title":"코드맵 (codemap)","summary":"코드베이스를 **이름 → 뼈대 → 핵심 줄** 순으로 좁혀 읽고, 클릭형 마인드맵 HTML 한 장으로 만드는 도구.","generated":"2026-11-15","ordered":true,"scope":{"analyzed":5,"in_map":5,"dropped_files":3,"dropped_dirs":1,"dropped":[{"reason":"문서","files":2,"dirs":0,"examples":["LICENSE","SKILL.md"]},{"reason":"예제·샘플 폴더","files":0,"dirs":1,"examples":["examples/"]},{"reason":"숨김 설정 파일","files":1,"dirs":0,"examples":[".gitignore"]}],"groups":[]},"nodes":[{"id":"n1","title":"명령 받기","summary":"scan · skeleton · read · build 네 단계를 하위 명령으로 나눠 받는다.","file":"skill_scripts/codemap.py","code":[{"title":"하위 명령 등록","file":"skill_scripts/codemap.py","start":66,"end":72,"lang":"python","source":"def main(argv=None):\n    p = argparse.ArgumentParser(prog=\"codemap\", description=\"코드베이스 → 마인드맵 HTML\")\n    sub = p.add_subparsers(dest=\"cmd\", required=True)\n\n    s = sub.add_parser(\"scan\", help=\"이름만 보고 분석 대상을 고른다\")\n    s.add_argument(\"src\", help=\"프로젝트 폴더 또는 zip 파일\")\n    s.add_argument(\"--out\", help=\"작업 폴더 (기본: ./codemap_out/\u003c이름>)\")","explain":"`argparse` 의 서브파서로 단계마다 명령을 하나씩 만든다. 각 단계가 파일(manifest.json → skeleton.md → analysis.json)로 결과를 넘기므로, 중간에 끊겨도 그 단계부터 다시 실행할 수 있다.","points":[{"a":68,"b":68,"text":"`required=True` — 하위 명령 없이 실행하면 사용법을 보여 준다."},{"a":70,"b":72,"text":"첫 단계 `scan` 은 폴더와 zip 을 모두 받는다."}]}]},{"id":"n2","title":"이름만 보고 거르기","summary":"파일을 열지 않고 경로와 크기만으로 분석 대상을 고른다. 여기서 버린 것은 토큰을 0 쓴다.","file":"skill_scripts/scan.py","children":[{"id":"n3","title":"폴더째 버리기","summary":"node_modules, dist, .git 같은 폴더는 안으로 내려가지도 않는다.","code":[{"title":"폴더 이름 판정","file":"skill_scripts/scan.py","start":136,"end":148,"lang":"python","source":"def dir_drop_reason(dirname: str, keep_tests: bool, keep_samples: bool):\n    low = dirname.lower()\n    for reason, names in DIR_RULES.items():\n        if dirname in names or low in names:\n            return reason\n    if dirname.endswith(\".egg-info\") or dirname.endswith(\".xcassets\") \\\n            or dirname.endswith(\".xcodeproj\") or dirname.endswith(\".xcworkspace\"):\n        return \"빌드 산출물·캐시 폴더\"\n    if not keep_tests and low in TEST_DIRS:\n        return \"테스트 코드\"\n    if not keep_samples and low in SAMPLE_DIRS:\n        return \"예제·샘플 폴더\"\n    return None","explain":"폴더 **이름 하나만** 보고 버릴지 정한다. 버릴 때는 사유 문자열을, 남길 때는 `None` 을 돌려준다. 사유는 나중에 HTML의 '분석 범위' 패널에 그대로 표시된다.","points":[{"a":138,"b":140,"text":"`DIR_RULES` 표에서 찾는다: 의존성 / 빌드 산출물 / 버전관리 / 자동 생성 / 문서."},{"a":144,"b":147,"text":"테스트·예제 폴더는 옵션(`--keep-tests`, `--keep-samples`)으로 되살릴 수 있다."}]},{"title":"내려가지 않고 건너뛰기","file":"skill_scripts/scan.py","start":218,"end":232,"lang":"python","source":"def walk_dir(root, opts, dropped):\n    \"\"\"폴더를 훑는다. 버릴 폴더는 아예 내려가지 않는다.\"\"\"\n    seen = 0\n    for cur, dirs, files in os.walk(root, topdown=True, followlinks=False):\n        relcur = os.path.relpath(cur, root).replace(os.sep, \"/\")\n        relcur = \"\" if relcur == \".\" else relcur + \"/\"\n        keep_dirs = []\n        for d in sorted(dirs):\n            reason = dir_drop_reason(d, opts[\"keep_tests\"], opts[\"keep_samples\"])\n            if reason is None and os.path.exists(os.path.join(cur, d, \"pyvenv.cfg\")):\n                reason = \"의존성·외부 라이브러리 폴더\"\n            if reason and _user_rule(relcur + d + \"/\", opts[\"include\"], None) != \"keep\":\n                dropped.add(reason, relcur + d + \"/\", is_dir=True)\n            else:\n                keep_dirs.append(d)","explain":"`os.walk` 는 `dirs` 목록을 제자리에서 고치면 그 폴더로 내려가지 않는다. 이 성질을 이용해 버릴 폴더를 **훑는 비용조차 없이** 건너뛴다.","points":[{"a":227,"b":228,"text":"이름이 `env` 처럼 애매해도 `pyvenv.cfg` 가 있으면 가상환경으로 본다 (존재 여부만 확인, 내용은 읽지 않음)."},{"a":229,"b":229,"text":"사용자가 `--include` 로 지정한 폴더는 규칙보다 우선한다."}]}]},{"id":"n4","title":"파일 하나씩 판정","summary":"잠금 파일 · 바이너리 · 생성 코드 · 테스트 · 문서 · 스타일 · 데이터 순으로 걸러 낸다.","code":[{"title":"classify_file()","file":"skill_scripts/scan.py","start":151,"end":189,"lang":"python","source":"def classify_file(rel: str, size: int, keep_tests: bool):\n    \"\"\"(판정, 값) 을 돌려준다. 판정이 'keep' 이면 값은 (lang, role), 'drop' 이면 사유.\"\"\"\n    name = os.path.basename(rel)\n    low = name.lower()\n    ext = os.path.splitext(low)[1]\n    depth = rel.count(\"/\")\n\n    if low in LOCK_NAMES:\n        return \"drop\", \"잠금 파일·소스맵·압축본\"\n    if low in MANIFEST_NAMES and depth \u003c= 2:\n        return \"keep\", (\"manifest\", \"manifest\")\n    if low.startswith(\"readme\") and depth == 0:\n        return \"keep\", (\"readme\", \"readme\")\n    if name.startswith(\".\"):\n        return \"drop\", \"숨김 설정 파일\"\n    if ext in BINARY_EXT:\n        return \"drop\", \"이미지·폰트·미디어·바이너리\"\n    if _match_any(low, GENERATED_PATTERNS):\n        if \".min.\" in low or low.endswith(\".map\") or \"bundle\" in low or \"chunk\" in low:\n            return \"drop\", \"잠금 파일·소스맵·압축본\"\n        return \"drop\", \"자동 생성 코드\"\n    if not keep_tests and _match_any(low, TEST_PATTERNS):\n        return \"drop\", \"테스트 코드\"\n    if _match_any(low, TOOLING_PATTERNS):\n        return \"drop\", \"빌드·도구 설정\"\n    if ext in CODE_EXT:\n        if size == 0:\n            return \"drop\", \"빈 파일\"\n        if size > MAX_CODE_BYTES or (ext == \".sql\" and size > MAX_SQL_BYTES):\n            return \"drop\", \"너무 큰 단일 파일 (생성물·데이터로 추정)\"\n        return \"keep\", (CODE_EXT[ext], \"code\")\n    if ext in DOC_EXT or low in (\"license\", \"licence\", \"changelog\", \"authors\",\n                                 \"contributing\", \"notice\", \"copying\"):\n        return \"drop\", \"문서\"\n    if ext in STYLE_EXT:\n        return \"drop\", \"스타일시트\"\n    if ext in DATA_EXT:\n        return \"drop\", \"데이터·설정 파일\"\n    return \"drop\", \"기타 (코드 아님)\"","explain":"규칙을 **위에서부터 차례로** 적용해 처음 걸리는 사유로 버린다. 끝까지 살아남고 코드 확장자인 파일만 `keep` 이 된다.\n\n`package.json` 같은 명세 파일과 최상위 README 는 코드가 아니어도 남긴다. 몇 줄만 봐도 프로젝트 성격을 알려 주는 값싼 단서이기 때문이다.","points":[{"a":160,"b":163,"text":"명세 파일·README 는 예외적으로 유지."},{"a":168,"b":171,"text":"`*.min.js`, `*_pb2.py`, `*.g.dart` 등 이름 패턴으로 생성 코드를 알아본다."},{"a":176,"b":181,"text":"코드라도 1MB 를 넘으면 생성물·데이터로 보고 제외한다."}]}]},{"id":"n5","title":"반복 묶음 접기","summary":"같은 폴더에 같은 이름 패턴이 여러 개면 대표만 남긴다.","code":[{"title":"번호 시리즈 찾기","file":"skill_scripts/scan.py","start":296,"end":304,"lang":"python","source":"def stem(f):\n    return os.path.splitext(os.path.basename(f[\"path\"]))[0]\n\nnumbered = [f for f in remaining\n            if re.match(r\"^[vV]?\\d+([_\\-.]|$)\", stem(f)) or re.search(r\"\\d{2,}$\", stem(f))]\nif len(numbered) >= 4:\n    groups.append({\"dir\": d, \"pattern\": \"번호 시리즈 *%s\" % ext,\n                   \"members\": numbered, \"always\": True})\n    remaining = [f for f in remaining if f not in numbered]","explain":"`0001_init.sql`, `page03.ts` 처럼 번호가 붙은 파일이 한 폴더에 4개 이상이면 '번호 시리즈' 묶음으로 본다. 이런 파일은 구조가 거의 같아서 하나만 읽어도 충분하다.","points":[{"a":299,"b":300,"text":"앞에 번호가 붙거나(`v2_`, `0001_`) 끝이 두 자리 이상 숫자면 해당."},{"a":303,"b":303,"text":"`always: True` — 프로젝트 크기와 상관없이 항상 접는다."}]},{"title":"접을지 결정","file":"skill_scripts/scan.py","start":381,"end":394,"lang":"python","source":"# 반복 묶음: 번호 시리즈는 항상, 그 외는 큰 프로젝트일 때만 접는다\ngroups_out = []\nfor i, g in enumerate(find_groups(files)):\n    do_collapse = collapse == \"always\" or (collapse == \"auto\" and (g[\"always\"] or big))\n    rep_files = pick_reps(g[\"members\"], reps)\n    rep_paths = [f[\"path\"] for f in rep_files]\n    others = [f for f in g[\"members\"] if f[\"path\"] not in rep_paths]\n    gid = \"g%d\" % (i + 1)\n    if do_collapse:\n        for f in others:\n            files.remove(f)\n            dropped.add(\"반복 패턴 (대표만 분석)\", f[\"path\"], f[\"size\"])\n        for f in rep_files:\n            f[\"group\"] = gid","explain":"묶음을 찾았다고 무조건 버리지는 않는다. `*Controller` 같은 접미사 묶음은 각자 다른 기능일 수 있으므로 **큰 프로젝트일 때만** 접는다. 접으면 대표 파일만 남고 나머지는 이름만 기록된다.","points":[{"a":384,"b":384,"text":"판단 기준: 번호 시리즈이거나, 프로젝트가 크거나(`big`), 사용자가 강제했거나."},{"a":385,"b":385,"text":"대표는 가장 큰 파일과 중간 크기 파일 — 가장 풍부한 것과 평균적인 것."},{"a":390,"b":392,"text":"나머지는 목록에서 빼고 '반복 패턴' 사유로 기록."}]}]},{"id":"n6","title":"zip 은 살아남은 것만 풀기","summary":"걸러진 파일은 압축 해제조차 하지 않는다.","code":[{"title":"선별 압축 해제","file":"skill_scripts/scan.py","start":402,"end":418,"lang":"python","source":"# zip 이면 살아남은 파일만 푼다\nos.makedirs(out_dir, exist_ok=True)\nroot = src\nif is_zip:\n    root = os.path.join(out_dir, \"src\")\n    total = 0\n    for f in files:\n        info = zinfos[f[\"path\"]]\n        total += info.file_size\n        if total > 300_000_000:\n            raise SystemExit(\"압축 해제 용량이 300MB를 넘어 중단합니다.\")\n        dest = os.path.join(root, f[\"path\"])\n        if not os.path.abspath(dest).startswith(os.path.abspath(root) + os.sep):\n            continue\n        os.makedirs(os.path.dirname(dest), exist_ok=True)\n        with zf.open(info) as fi, open(dest, \"wb\") as fo:\n            fo.write(fi.read())","explain":"zip 입력이면 이름 목록에 규칙을 먼저 적용하고, **통과한 파일만** 작업 폴더에 푼다.","points":[{"a":410,"b":412,"text":"압축 폭탄 방지: 합계 300MB 를 넘으면 중단."},{"a":414,"b":415,"text":"경로가 작업 폴더 밖을 가리키면 건너뛴다 (zip-slip 방지)."}]}]}]},{"id":"n7","title":"뼈대 뽑기","summary":"원문 대신 시그니처 · 호출 관계 · import 그래프만 추린 요약본을 만든다. 로컬에서 돌므로 토큰 0.","file":"skill_scripts/skeleton.py","children":[{"id":"n8","title":"함수·클래스 찾기","summary":"언어에 따라 두 가지 방법을 쓴다.","children":[{"id":"n9","title":"파이썬: 문법 트리","summary":"`ast` 로 정확한 줄 범위와 독스트링 첫 줄을 얻는다.","code":[{"title":"py_symbols()","file":"skill_scripts/skeleton.py","start":148,"end":166,"lang":"python","source":"def py_symbols(text):\n    tree = ast.parse(text)\n    out = []\n\n    def start_of(node):\n        decos = getattr(node, \"decorator_list\", [])\n        return min([node.lineno] + [d.lineno for d in decos])\n\n    def doc(node):\n        try:\n            d = ast.get_docstring(node, clean=True)\n        except Exception:\n            d = None\n        return _short(d.strip().splitlines()[0], 70) if d and d.strip() else \"\"\n\n    def decos(node):\n        res = []\n        for d in getattr(node, \"decorator_list\", [])[:2]:\n            try:","explain":"파이썬은 표준 라이브러리 `ast` 로 파싱한다. 정규식보다 정확하고, 데코레이터(`@app.route` 등)가 붙은 줄부터 시작 줄로 잡아 준다.","points":[{"a":152,"b":154,"text":"데코레이터가 있으면 그 줄을 시작으로 삼는다."},{"a":156,"b":161,"text":"독스트링은 첫 줄만 70자까지 — 설명은 값싸고 신호가 좋다."}]}]},{"id":"n10","title":"그 외 언어: 정규식","summary":"JS/TS, Go, Rust, Java, Kotlin, Swift, Dart 등 계열별 패턴.","code":[{"title":"generic_symbols()","file":"skill_scripts/skeleton.py","start":269,"end":299,"lang":"python","source":"def generic_symbols(lines, fam):\n    pats = COMPILED.get(fam)\n    if not pats:\n        return []\n    raw = []\n    for i, line in enumerate(lines):\n        if not line.strip() or len(line) > 400:\n            continue\n        first = line.split(None, 1)[0] if line.split() else \"\"\n        for kind, rx in pats:\n            m = rx.match(line)\n            if not m:\n                continue\n            name = m.group(1)\n            if name in CONTROL:\n                continue\n            if fam == \"typed\" and kind == \"func\" and first.rstrip(\"(\") in CONTROL:\n                continue  # `return foo(x)` 같은 문장을 함수 정의로 오인하지 않게\n            if kind == \"type\":\n                end = brace_end(lines, i) if \"{\" in line else i\n            elif fam in INDENT_FAMILIES:\n                end = indent_end(lines, i)\n            elif fam in (\"sql\", \"lua\", \"r\", \"sh\") and \"{\" not in line:\n                end = None\n            else:\n                end = brace_end(lines, i)\n            raw.append({\"kind\": kind, \"name\": name, \"start\": i + 1,\n                        \"end\": (end + 1) if end is not None else None,\n                        \"sig\": _short(line.strip().rstrip(\"{\").rstrip(), 90),\n                        \"doc\": _doc_above(lines, i), \"depth\": 0, \"decos\": []})\n            break","explain":"한 줄씩 보며 언어 계열별 정규식에 맞는 '정의 줄'을 찾고, 중괄호 짝(`brace_end`)이나 들여쓰기(`indent_end`)로 끝 줄을 구한다.","points":[{"a":283,"b":286,"text":"`if (...) {` 나 `return foo(x)` 를 함수 정의로 오인하지 않도록 제어 키워드를 걸러 낸다."},{"a":287,"b":294,"text":"끝 줄 찾는 방식을 언어 계열에 따라 고른다."}]}]}]},{"id":"n11","title":"호출 관계 잇기","summary":"함수 본문에서 '프로젝트 안에 정의된 이름'을 부르는 곳만 골라낸다.","code":[{"title":"이름표 만들고 본문 훑기","file":"skill_scripts/skeleton.py","start":484,"end":503,"lang":"python","source":"# 프로젝트 전체 심볼 이름표 → 호출 관계\ndefined = defaultdict(set)\nfor p, info in infos.items():\n    for s in info[\"syms\"]:\n        if s[\"kind\"] != \"type\":\n            defined[s[\"name\"]].add(p)\nfor p, info in infos.items():\n    lines = info[\"text_lines\"]\n    covered = [False] * (len(lines) + 2)\n    for s in info[\"syms\"]:\n        if s[\"kind\"] in (\"func\", \"method\"):\n            body = \"\\n\".join(lines[s[\"start\"] - 1: s[\"end\"]])\n            calls = []\n            for name in CALL_RE.findall(body):\n                if name == s[\"name\"] or name in calls or name in COMMON_NAMES:\n                    continue\n                where = defined.get(name)\n                if where and (p in where or len(where) \u003c= 3):\n                    calls.append(name)\n            s[\"calls\"] = calls[:6]","explain":"먼저 프로젝트 전체의 함수·클래스 이름표(`defined`)를 만든다. 그다음 각 함수 본문에서 `이름(` 꼴을 찾아, 이름표에 있는 것만 호출로 기록한다. 이것이 마인드맵의 **흐름**을 잡는 재료다.","points":[{"a":485,"b":489,"text":"이름 → 그 이름이 정의된 파일들."},{"a":498,"b":498,"text":"`get`, `run` 처럼 너무 흔한 이름은 정보가 없어 뺀다."},{"a":501,"b":501,"text":"같은 이름이 4개 이상 파일에 있으면 모호하므로 제외 (같은 파일 안이면 인정)."}]}]},{"id":"n12","title":"중요도 매기기","summary":"진입점 · 많이 import 되는 파일이 위로 온다.","code":[{"title":"점수 계산","file":"skill_scripts/skeleton.py","start":517,"end":538,"lang":"python","source":"# 중요도\nfor p, info in infos.items():\n    stem = os.path.splitext(os.path.basename(p))[0]\n    toks = set(re.split(r\"[_\\-.]+\", re.sub(r\"([a-z])([A-Z])\", r\"\\1_\\2\", stem).lower()))\n    score = 4.0 * fan_in[p] + 1.5 * min(len(info[\"imports\"]), 6) + min(info[\"lines\"], 400) / 40.0\n    if info[\"entry_marker\"]:\n        score += 30\n    if stem.lower() in ENTRY_STEMS:\n        score += 10\n    if toks & LOW_TOKENS:\n        score -= 6\n    if stem == \"__init__\" and info[\"lines\"] \u003c 30:\n        score -= 8\n    score -= 1.5 * p.count(\"/\")\n    if p in dup_of:\n        score -= 100\n    info[\"score\"] = round(score, 1)\n    info[\"fan_in\"] = fan_in[p]\n    info[\"is_entry\"] = info[\"entry_marker\"] or (\n        stem.lower() in ENTRY_STEMS and fan_in[p] == 0)\n\norder = sorted(infos, key=lambda p: -infos[p][\"score\"])","explain":"파일마다 점수를 매겨 정렬한다. 이 순서가 '예산이 모자랄 때 무엇을 먼저 자세히 보여 줄지'를 결정한다.","points":[{"a":521,"b":521,"text":"기본 점수: 이 파일을 import 하는 파일 수(가중 4) + 내보내는 import + 길이."},{"a":522,"b":525,"text":"`__main__`, `app.listen(` 같은 진입점 표시나 `main`/`app`/`index` 이름에 가산점."},{"a":526,"b":532,"text":"util·config 류, 깊은 경로, 내용이 중복된 파일은 감점."}]}]},{"id":"n13","title":"예산 안에서 상세도 조절","summary":"중요한 파일은 자세히, 덜 중요한 파일은 한 줄, 나머지는 이름만.","code":[{"title":"3단계 상세도","file":"skill_scripts/skeleton.py","start":618,"end":641,"lang":"python","source":"for p in order:\n    if p in dup_of:\n        names_only.append(\"%s (= %s 와 내용 동일)\" % (p, dup_of[p]))\n        levels[p] = 0\n        continue\n    if p in same_shape:\n        brief.append(render_brief(p) + \"  ≅ %s 와 같은 구조\" % same_shape[p])\n        levels[p] = 1\n        used += tok(brief[-1])\n        continue\n    if used \u003c budget * 0.8:\n        block = render_full(p)\n        if used + tok(block) \u003c= budget * 0.9 or not full:\n            full.append(block)\n            levels[p] = 2\n            used += tok(block)\n            continue\n    if used \u003c budget:\n        brief.append(render_brief(p))\n        levels[p] = 1\n        used += tok(brief[-1])\n    else:\n        names_only.append(p)\n        levels[p] = 0","explain":"중요도 순으로 돌면서 토큰 예산(기본 12,000)을 채운다. 예산의 80%까지는 **상세**(시그니처+호출), 100%까지는 **요약**(한 줄), 넘으면 **이름만** 싣는다. 프로젝트가 아무리 커도 뼈대 크기는 예산을 넘지 않는다.","points":[{"a":619,"b":622,"text":"내용이 완전히 같은 파일은 이름만."},{"a":623,"b":627,"text":"함수 구성이 똑같은 파일(CRUD 류)은 첫 파일만 자세히, 나머지는 '같은 구조' 표시."},{"a":628,"b":634,"text":"예산 80% 전까지는 상세 블록."}]}]}]},{"id":"n14","title":"필요한 줄만 읽기","summary":"LLM 이 뼈대를 보고 고른 줄 범위만 꺼내 준다. 누적 줄 수를 세어 예산을 알려 준다.","file":"skill_scripts/skeleton.py","code":[{"title":"범위 해석","file":"skill_scripts/skeleton.py","start":728,"end":742,"lang":"python","source":"out, this = [], 0\nfor spec in specs:\n    if \"::\" in spec:\n        path, sym = spec.split(\"::\", 1)\n        hits = [s for s in sk.get(path, {}).get(\"syms\", []) if s[\"name\"] == sym]\n        if not hits:\n            out.append(\"!! %s: 심볼 '%s' 을(를) 찾지 못함\" % (path, sym))\n            continue\n        a, b = hits[0][\"start\"], hits[0][\"end\"]\n    else:\n        m = re.match(r\"^(.*):(\\d+)(?:-(\\d+))?$\", spec)\n        if not m:\n            out.append(\"!! 형식 오류: %s (경로:시작-끝 또는 경로::심볼)\" % spec)\n            continue\n        path, a = m.group(1), int(m.group(2))","explain":"`경로:시작-끝` 또는 `경로::함수이름` 두 가지 형식을 받는다. 함수 이름으로 요청하면 뼈대에 저장해 둔 줄 범위를 찾아 준다. 파일을 통째로 읽는 대신 필요한 함수만 읽게 하는 장치다.","points":[{"a":730,"b":736,"text":"`::` 형식 — skeleton.json 에서 심볼을 찾아 줄 범위로 바꾼다."},{"a":738,"b":742,"text":"`:` 형식 — 줄 번호를 직접 지정."}]}]},{"id":"n15","title":"HTML 로 조립","summary":"analysis.json 의 줄 참조를 실제 코드로 바꿔 템플릿에 끼워 넣는다.","file":"skill_scripts/build.py","children":[{"id":"n16","title":"참조 → 실제 코드","summary":"LLM 은 코드를 다시 쓰지 않는다. 줄 번호만 주면 여기서 꺼낸다.","code":[{"title":"검증하고 꺼내기","file":"skill_scripts/build.py","start":80,"end":91,"lang":"python","source":"if not (1 \u003c= a \u003c= b \u003c= len(lines)):\n    errors.append(\"%s: 줄 범위 %s-%s 가 파일 길이(%d줄)를 벗어남\" % (label, a, b, len(lines)))\n    return None\nn = b - a + 1\nif n > MAX_SNIPPET:\n    errors.append(\"%s: %d줄은 너무 김 (최대 %d줄). 핵심 부분만 고르거나 조각을 나눌 것\" % (label, n, MAX_SNIPPET))\n    return None\nif n > WARN_SNIPPET:\n    warns.append(\"%s: %d줄 — 더 좁힐 수 있는지 검토\" % (label, n))\nif not str(c.get(\"explain\", \"\")).strip():\n    warns.append(\"%s: explain 이 비어 있음\" % label)\nsrc = textwrap.dedent(\"\\n\".join(l.expandtabs(4).rstrip() for l in lines[a - 1:b]))","explain":"출력 토큰은 입력보다 훨씬 비싸다. 그래서 analysis.json 에는 `file` 과 `lines` 만 있고, 코드 원문은 이 스크립트가 디스크에서 읽어 넣는다. 범위가 틀리면 오류로 알려 줘서 LLM 이 고칠 수 있게 한다.","points":[{"a":80,"b":82,"text":"줄 범위가 파일을 벗어나면 오류."},{"a":84,"b":86,"text":"조각 하나는 최대 80줄 — 길면 핵심만 다시 고르게 한다."},{"a":91,"b":91,"text":"공통 들여쓰기를 걷어 내 박스 안에서 왼쪽 정렬되게 한다."}]}]},{"id":"n17","title":"템플릿에 끼워 넣기","summary":"자리표시자 하나를 JSON 으로 바꾸면 끝. 결과는 파일 한 개.","code":[{"title":"데이터 주입","file":"skill_scripts/build.py","start":184,"end":190,"lang":"python","source":"with open(template_path, encoding=\"utf-8\") as fp:\n    html = fp.read()\nif \"__CODEMAP_DATA__\" not in html:\n    raise SystemExit(\"템플릿에 __CODEMAP_DATA__ 자리표시자가 없습니다.\")\npayload = json.dumps(data, ensure_ascii=False, separators=(\",\", \":\"))\npayload = payload.replace(\"\u003c\", \"\\\\u003c\").replace(\"\\u2028\", \"\\\\u2028\").replace(\"\\u2029\", \"\\\\u2029\")\nhtml = html.replace(\"__CODEMAP_DATA__\", payload, 1)","explain":"템플릿의 `__CODEMAP_DATA__` 를 분석 결과 JSON 으로 치환한다. 외부 파일이 필요 없는 **단일 HTML** 이 되어 메일이나 메신저로 그대로 보낼 수 있다.","points":[{"a":189,"b":189,"text":"코드 안에 `\u003c/script>` 가 있어도 깨지지 않도록 `\u003c` 를 유니코드 이스케이프로 바꾼다."}]}]}]},{"id":"n18","title":"마인드맵 화면","summary":"박스를 누르면 하위 기능과 코드가, 코드를 누르면 설명이 펼쳐진다. 다시 누르면 접힌다.","file":"template/mindmap.html","children":[{"id":"n19","title":"펼치고 접기","summary":"하위 박스는 처음 펼칠 때 만들고, 접을 때는 숨기기만 한다.","code":[{"title":"setOpen()","file":"template/mindmap.html","start":421,"end":436,"lang":"html","source":"function setOpen(it, open) {\n  if (!it.kids.length || it.open === open) return;\n  if (open && !it.kidsEl) {\n    var k = document.createElement('div');\n    k.className = 'kids' + (it.ordered ? ' ordered' : '');\n    it.kids.forEach(function (c) { k.appendChild(renderBranch(c)); });\n    it.el.appendChild(k); it.kidsEl = k;\n  }\n  it.open = open;\n  it.kidsEl.hidden = !open;\n  it.nodeEl.classList.toggle('open', open);\n  it.nodeEl.setAttribute('aria-expanded', String(open));\n  var tog = it.nodeEl.querySelector(':scope > .tog');\n  if (tog) tog.textContent = open ? '−' : it.kids.length;\n  if (open) { it.kidsEl.classList.remove('enter'); void it.kidsEl.offsetWidth; it.kidsEl.classList.add('enter'); }\n}","explain":"한 박스의 열림 상태를 바꾼다. 하위 박스는 **처음 펼칠 때만** 만들어서, 지도가 커도 시작이 빠르다. 접을 때는 지우지 않고 숨겨서 안쪽에 펼쳐 둔 상태가 유지된다.","points":[{"a":423,"b":428,"text":"처음 펼칠 때 하위 박스를 만든다."},{"a":433,"b":434,"text":"손잡이 표시: 닫혀 있으면 하위 개수, 열려 있으면 −."}]},{"title":"누른 박스 붙잡아 두기","file":"template/mindmap.html","start":505,"end":517,"lang":"html","source":"function keepStill(anchorEl, fn) {\n  var a = anchorEl.getBoundingClientRect();\n  fn();\n  var b = anchorEl.getBoundingClientRect();\n  tx += a.left - b.left; ty += a.top - b.top;\n  apply(); draw();\n}\nfunction toggle(it) {\n  if (!it.kids.length) return;\n  canvas.classList.remove('glide');\n  keepStill(it.nodeEl, function () { setOpen(it, !it.open); });\n  settle(it);\n}","explain":"하위가 펼쳐지면 부모 박스는 세로 가운데로 다시 정렬되므로 화면에서 튀어 버린다. 펼치기 전후의 화면 위치 차이만큼 캔버스를 반대로 밀어, **누른 박스가 제자리에 있는 것처럼** 보이게 한다.","points":[{"a":506,"b":509,"text":"전후 위치를 재서 차이만큼 보정."},{"a":516,"b":516,"text":"새로 나온 박스가 화면 밖이면 부드럽게 끌어온다."}]}]},{"id":"n20","title":"연결선 그리기","summary":"박스 위치를 읽어 SVG 곡선으로 잇는다.","code":[{"title":"draw()","file":"template/mindmap.html","start":444,"end":461,"lang":"html","source":"function draw() {\n  var out = [];\n  (function walk(it) {\n    if (!it.open || !it.kidsEl) return;\n    var p = box(it.nodeEl), x1 = p.x + p.w + 11, y1 = p.y + p.h / 2, prev = null;\n    it.kids.forEach(function (c) {\n      var q = box(c.nodeEl), x2 = q.x, y2 = q.y + q.h / 2, mx = (x2 - x1) * 0.5;\n      out.push('\u003cpath class=\"edge ' + c.type + '\" style=\"--h:' + (c.hue == null ? 255 : c.hue) + '\" d=\"M' + x1 + ' ' + y1 + 'C' + (x1 + mx) + ' ' + y1 + ' ' + (x2 - mx) + ' ' + y2 + ' ' + x2 + ' ' + y2 + '\"/>');\n      if (it.ordered && prev && c.type === 'node') {\n        var fx = q.x + 22;\n        out.push('\u003cpath class=\"flow\" marker-end=\"url(#arr)\" d=\"M' + fx + ' ' + (prev.y + prev.h + 3) + 'L' + fx + ' ' + (q.y - 3) + '\"/>');\n      }\n      if (c.type === 'node') prev = q;\n      walk(c);\n    });\n  })(root);\n  edgeG.innerHTML = out.join('');\n}","explain":"열려 있는 가지를 따라 내려가며 부모의 오른쪽 가운데에서 자식의 왼쪽 가운데로 곡선을 긋는다. 최상위처럼 순서가 있는 단계끼리는 위→아래 화살표를 더해 **전체 흐름**을 보여 준다.","points":[{"a":450,"b":451,"text":"부모→자식 3차 베지어 곡선. 색은 가지마다 다르다."},{"a":452,"b":455,"text":"순서 있는 형제 사이의 흐름 화살표."}]}]}]}],"links":[{"from":"n2","to":"n7","label":"manifest.json"},{"from":"n7","to":"n14","label":"skeleton.json"},{"from":"n15","to":"n18","label":"데이터 주입"}]}</script>

  if (go) { reveal(go.dataset.go); return; }
  var pt = target.closest('.pt');
  if (pt) { var on = !pt.classList.contains('pin'); pt.classList.toggle('pin', on); markLines(pt, 'pin', on); return; }
  var n = target.closest('.node');
  if (n && n._it) toggle(n._it);
}
tree.addEventListener('click', function (e) { if (!moved) activate(e.target); });
tree.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  if (e.target.closest('button')) return;
  if (e.target.classList.contains('node') || e.target.classList.contains('pt')) { e.preventDefault(); activate(e.target); }
});
tree.addEventListener('mouseover', function (e) { var pt = e.target.closest('.pt'); if (pt) markLines(pt, 'hl', true); });
tree.addEventListener('mouseout', function (e) { var pt = e.target.closest('.pt'); if (pt && !pt.contains(e.relatedTarget)) markLines(pt, 'hl', false); });

function center() { var r = vp.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
var ACT = {
  more: more, less: less, reset: reset,
  fit: function () { fit(true); },
  zin: function () { var c = center(); glide(); zoomAt(c[0], c[1], 1.2); },
  zout: function () { var c = center(); glide(); zoomAt(c[0], c[1], 1 / 1.2); },
  theme: function () {
    var el = document.documentElement, cur = el.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = cur === 'dark' ? 'light' : 'dark';
    el.setAttribute('data-theme', next);
    try { localStorage.setItem('codemap-theme', next); } catch (e) {}
  },
  scope: function () { scopeEl.hidden = !scopeEl.hidden; }
};
document.addEventListener('click', function (e) { var b = e.target.closest('[data-act]'); if (b && ACT[b.dataset.act]) ACT[b.dataset.act](); });
document.addEventListener('keydown', function (e) {
  if (e.target.closest('input,textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '+' || e.key === '=') ACT.zin(); else if (e.key === '-') ACT.zout(); else if (e.key === '0') ACT.fit();
  else if (e.key === 'Escape') scopeEl.hidden = true;
});

/* ── 머리말·분석 범위 ── */
try { var saved = localStorage.getItem('codemap-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); } catch (e) {}
$('#t-title').textContent = DATA.title || '코드맵';
$('#t-sub').textContent = '코드맵' + (DATA.generated ? ' · ' + DATA.generated : '');
if (DATA === DEMO) document.title = '코드맵 템플릿';
var S = DATA.scope, sb = $('#b-scope');
if (S) {
  sb.dataset.act = 'scope';
  sb.innerHTML = '파일 <b>' + S.analyzed + '</b>개 분석 · <b>' + (S.dropped_files + S.dropped_dirs) + '</b>건 제외';
  var h = '<button type="button" class="btn icon x" data-act="scope" aria-label="닫기">✕</button><h2>분석 범위</h2>' +
    '<p>토큰을 아끼기 위해, 이름만 보고 필요 없다고 판단한 파일은 열어 보지 않았습니다. 이 지도에 없는 내용은 아래에서 제외된 것일 수 있습니다.</p>' +
    '<div class="stat"><div><b>' + S.analyzed + '</b><span>살펴본 코드 파일</span></div><div><b>' + S.in_map + '</b><span>지도에 실린 파일</span></div><div><b>' + S.dropped_files + '</b><span>제외한 파일</span></div></div>';
  if (S.dropped && S.dropped.length) {
    h += '<h3>제외한 것</h3>';
    S.dropped.forEach(function (d) {
      var n = [d.files ? '파일 ' + d.files : '', d.dirs ? '폴더 ' + d.dirs : ''].filter(Boolean).join(' · ');
      h += '<div class="drop"><div>' + esc(d.reason) + '<span>' + n + '</span></div><small>' + (d.examples || []).map(esc).join(', ') + '</small></div>';
    });
  }
  if (S.groups && S.groups.length) {
    h += '<h3>반복 묶음</h3>';
    S.groups.forEach(function (g) {
      h += '<div class="drop"><div>' + esc(g.pattern) + '<span>×' + g.count + '</span></div><small>' + (g.collapsed ? '대표만 분석: ' + (g.reps || []).map(function (r) { return esc(r.split('/').pop()); }).join(', ') : '전부 분석 (같은 패턴)') + '</small></div>';
    });
  }
  scopeEl.innerHTML = h;
} else sb.hidden = true;

/* ── 시작 ── */
tree.appendChild(renderBranch(root));
setOpen(root, true);
home(); draw();
if (window.ResizeObserver) new ResizeObserver(queueDraw).observe(tree);
window.addEventListener('resize', queueDraw);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(queueDraw);
})();
</script>
</body>
